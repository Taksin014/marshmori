<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marshmori 3D</title>
<style>
  body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", "Noto Sans Thai", system-ui, sans-serif; background: #0b0b0d; color: #f2f2f7; }
  body.light { background: #f3eee7; color: #3b302b; }
  main { padding: 28px 32px; display: flex; flex-direction: column; gap: 14px; max-width: 1240px; }
  header h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
  header p { margin: 4px 0 6px; color: #8e8e93; font-size: 15px; }
  body.light header p { color: #7c6e66; }
  .sec h2 { margin: 10px 0 0; font-size: 18px; font-weight: 700; }
  .sec p { margin: 2px 0 4px; font-size: 13px; color: #8e8e93; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 162px); gap: 12px; }
  .cell { background: #1c1c1e; border-radius: 20px; display: flex; flex-direction: column; align-items: center; padding: 6px 6px 10px; gap: 2px; }
  body.light .cell { background: #fbf8f4; box-shadow: 0 1px 0 rgba(60,40,20,.06); }
  .cell canvas { width: 150px; height: 150px; }
  .cell.tall canvas { height: 210px; }
  .cell span { font-size: 12.5px; color: #8e8e93; }
  #live { width: 420px; height: 520px; }
  body.export { background: transparent; }
  body.export main { padding: 0; }
  #stage { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<main id="root"></main>
<div id="stage"></div>
<script type="module" src="./marsh.ts"></script>
</body>
</html>
